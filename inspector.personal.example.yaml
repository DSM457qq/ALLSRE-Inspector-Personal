listen_host: 127.0.0.1
listen_port: 8876
data_dir: data
# Defaults to Desktop\ALLSRE-files. Override only if needed:
# file_storage_dir: C:\Users\<user>\Desktop\ALLSRE-files

# SecureCRT Bridge: Inspector owns the local bridge and SecureCRT tab script.
securecrt_bridge:
  enabled: true
  host: 127.0.0.1
  port: 8765
  # Idle Shell keepalive (sends a harmless no-op through the existing tab).
  # The tab script's 2-second registration heartbeat is separate and always on.
  shell_keepalive_enabled: true
  shell_keepalive_interval_seconds: 90

opencode:
  executable: auto
  # Personal Inspector requires OpenCode V2.
  api_version: "2"
  agent: inspector
  startup_timeout: 30
  # Optional; default false. Set true only when the selected model supports it.
  model_thinking: false
  model: custom/replace-with-model
  model_config:
    providerId: custom
    modelId: replace-with-model
    baseUrl: "https://model.example/v1"
    apiKey: "replace-with-api-key"
