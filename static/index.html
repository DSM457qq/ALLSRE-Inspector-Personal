<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALLSRE Inspector Personal</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 60px auto; padding: 0 20px; color: #17212b; }
    h1 { font-size: 26px; }
    button { padding: 10px 18px; margin: 6px 8px 6px 0; cursor: pointer; }
    pre { background: #f3f5f7; padding: 14px; overflow: auto; }
    .muted { color: #667; }
  </style>
</head>
<body>
  <h1>ALLSRE Inspector Personal</h1>
  <p class="muted">本地 SecureCRT 终端 + OpenCode Agent。没有 ConfigCenter、资产或浏览器自动登录。</p>
  <button onclick="openAgent()">打开 Agent</button>
  <button onclick="loadTerminals()">刷新终端列表</button>
  <button onclick="loadHealth()">健康状态</button>
  <h2>SecureCRT 终端</h2>
  <pre id="terminals">尚未加载</pre>
  <h2>状态</h2>
  <pre id="health">尚未加载</pre>
  <script>
    async function openAgent() {
      const r = await fetch('/api/v1/local-agent/start', {method: 'POST'});
      const v = await r.json();
      if (v.url) window.location.href = v.url;
      else alert(JSON.stringify(v));
    }
    async function loadTerminals() {
      const r = await fetch('/api/v1/tools/terminal-list');
      document.getElementById('terminals').textContent = JSON.stringify(await r.json(), null, 2);
    }
    async function loadHealth() {
      const r = await fetch('/health');
      document.getElementById('health').textContent = JSON.stringify(await r.json(), null, 2);
    }
    loadHealth();
  </script>
</body>
</html>
