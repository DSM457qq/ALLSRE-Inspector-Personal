[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "allsre-inspector-personal"
version = "0.1.0"
description = "Standalone personal SecureCRT terminal + OpenCode Inspector"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "websocket-client>=1.8",
  "psutil>=6.0",
  "bashlex>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
allsre-inspector-personal = "allsre_inspector.personal.main:run"

[tool.setuptools.packages.find]
include = ["allsre_inspector*"]

[tool.setuptools.package-data]
"allsre_inspector.securecrt_bridge" = ["agent-input-lock.key"]

[tool.pytest.ini_options]
testpaths = ["tests"]
